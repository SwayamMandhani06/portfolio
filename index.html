    <!-- Instant Pre-Hydration Theme Restore Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          if (saved === 'cream') {
            document.documentElement.classList.add('cream');
          }
        } catch (e) {}
      })();
    </script>
